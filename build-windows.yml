name: Build TSMANIA TUNE (Windows VST3)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target TSMANIA_TUNE_VST3

      - name: Package VST3
        shell: pwsh
        run: |
          $candidate = Get-ChildItem -Path build -Directory -Recurse -Filter "TSMANIA TUNE.vst3" | Select-Object -First 1
          if (-not $candidate) {
            $candidate = Get-ChildItem -Path build -Directory -Recurse -Filter "*.vst3" | Select-Object -First 1
          }
          if (-not $candidate) { throw "No se encontró el bundle VST3 después de compilar." }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse -Force $candidate.FullName package/
          Compress-Archive -Path package/* -DestinationPath TSMANIA_TUNE_VST3_Windows_x64.zip -Force

      - name: Upload compiled VST3
        uses: actions/upload-artifact@v4
        with:
          name: TSMANIA_TUNE_VST3_Windows_x64
          path: TSMANIA_TUNE_VST3_Windows_x64.zip
          if-no-files-found: error
